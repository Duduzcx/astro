<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a0a2e" />
    <meta name="color-scheme" content="dark" />
    <title>Página não encontrada — Astro Bot</title>
    <link rel="icon" type="image/svg+xml" href="/astro-mark.svg" />
    <style>
      * { margin: 0; box-sizing: border-box; }
      body {
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1a0a2e;
        color: #cfc4dd;
        font-family: 'Inter Tight', system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
        padding: 24px;
      }
      h1 { font-size: clamp(2.4rem, 7vw, 4.5rem); font-weight: 480; color: #fffcf3; letter-spacing: -0.01em; }
      p { margin-top: 16px; font-size: 17px; line-height: 1.55; }
      a.pill {
        display: inline-block;
        margin-top: 32px;
        padding: 14px 28px;
        border-radius: 32px;
        background: #8434ce;
        color: #ffffff;
        text-decoration: none;
        font-size: 15px;
        transition: background 250ms ease;
      }
      a.pill:hover { background: #9a4fe0; }
      svg { width: 56px; height: 56px; margin-bottom: 28px; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 2.6 21 20H3L12 2.6Z" stroke="#8434ce" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M12 9.4 16.4 18H7.6L12 9.4Z" fill="#fffcf3"/>
      </svg>
      <h1>Página não encontrada.</h1>
      <p>O endereço que você tentou não existe — mas a operação continua de pé.</p>
      <a class="pill" href="/">Voltar pro início</a>
    </main>
  </body>
</html>
