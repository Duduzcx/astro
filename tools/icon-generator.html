<!doctype html><meta charset="utf-8">
<style>
  body{margin:0;background:#888;font-family:'Anton',sans-serif}
  .plate{position:relative;overflow:hidden}
  #apple{width:180px;height:180px;background:#0B2545;display:flex;align-items:center;justify-content:center}
  #apple svg{width:150px;height:150px}
  #fav32{width:64px;height:64px;background:#fff;display:flex;align-items:center;justify-content:center}
  #fav32 svg{width:64px;height:64px}
  #og{width:1200px;height:630px;background:#0a0f1e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
      background-image:radial-gradient(900px 600px at 78% -10%,rgba(77,132,224,.22),transparent 62%),radial-gradient(800px 600px at 8% 108%,rgba(122,179,255,.14),transparent 62%)}
  #og svg{width:186px;height:186px}
  #og .wm{display:flex;align-items:center;gap:22px}
  #og .word{display:flex;flex-direction:column;line-height:1}
  #og .astro{font-family:Anton,sans-serif;font-size:78px;letter-spacing:.04em;color:#f5f7fb;line-height:.9;text-transform:uppercase}
  #og .sol{font-family:Allura,cursive;font-size:58px;color:#8db4f5;align-self:flex-end;margin-top:-4px;margin-right:4px}
  #og p{font-family:'Inter Tight',system-ui,sans-serif;font-size:30px;color:#b9c2d4;margin:0}
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;480&family=Anton&family=Allura&display=swap" rel="stylesheet">
<template id="mark">
  <svg viewBox="-8 -8 136 136">
    <path d="M 71.84 50.99 Q 79.31 57.61 91.00 60.00 Q 79.31 62.39 71.84 69.01 L 93.91 91.08 A 46 46 0 0 0 93.91 28.92 Z" fill="CS" transform="rotate(-90 60 60)"/>
    <path d="M 71.84 50.99 Q 79.31 57.61 91.00 60.00 Q 79.31 62.39 71.84 69.01 L 93.91 91.08 A 46 46 0 0 0 93.91 28.92 Z" fill="CS" transform="rotate(0 60 60)"/>
    <path d="M 71.84 50.99 Q 79.31 57.61 91.00 60.00 Q 79.31 62.39 71.84 69.01 L 93.91 91.08 A 46 46 0 0 0 93.91 28.92 Z" fill="CS" transform="rotate(90 60 60)"/>
    <path d="M 71.84 50.99 Q 79.31 57.61 91.00 60.00 Q 79.31 62.39 71.84 69.01 L 93.91 91.08 A 46 46 0 0 0 93.91 28.92 Z" fill="CS" transform="rotate(180 60 60)"/>
  </svg>
</template>
<div id="apple" class="plate"></div>
<div id="fav32" class="plate"></div>
<div id="og" class="plate"><div class="wm"></div><p>Sistemas, sites, automações e integrações sob medida.</p></div>
<script>
  const tpl = document.getElementById('mark').innerHTML
  const paint = (sel, color) => { document.querySelector(sel).insertAdjacentHTML('afterbegin', tpl.replaceAll('CS', color)) }
  paint('#apple', '#ffffff')
  paint('#fav32', '#0B2545')
  const wm = document.querySelector('#og .wm')
  wm.insertAdjacentHTML('afterbegin', tpl.replaceAll('CS', '#f5f7fb'))
  wm.insertAdjacentHTML('beforeend', '<span class="word"><span class="astro">Astro</span><span class="sol">soluções</span></span>')
</script>
