<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/astro-mark.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171721" />
    <meta name="color-scheme" content="dark" />
    <title>Astro Bot — Tecnologia sob medida para empresas que precisam sair do papel</title>
    <meta
      name="description"
      content="A Astro Bot constrói sites, sistemas web, automações, integrações e produtos SaaS sob medida. Diagnóstico gratuito e primeira entrega em semanas, não em meses."
    />
    <meta property="og:title" content="Astro Bot — Tecnologia sob medida" />
    <meta
      property="og:description"
      content="Sites, sistemas, automações, integrações e SaaS. Da primeira conversa ao software rodando em produção."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Astro Bot — Tecnologia sob medida" />
    <meta
      name="twitter:description"
      content="Sites, sistemas, automações, integrações e SaaS. Da primeira conversa ao software rodando em produção."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Astro Bot",
        "legalName": "Astro Bot Tecnologia LTDA",
        "description": "Sistemas, sites, automações e integrações sob medida.",
        "email": "contato@astrobot.dev.br",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Av. Paulista, 1000, Sala 71, Bela Vista",
          "addressLocality": "São Paulo",
          "addressRegion": "SP",
          "addressCountry": "BR"
        },
        "sameAs": [
          "https://linkedin.com/company/astrobot",
          "https://instagram.com/astrobot.tech",
          "https://github.com/astrobot"
        ]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@360;400;420;480;530&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Netlify form registration: the build bot only sees static HTML, so the
         React form in Contact.tsx needs this hidden mirror with the same fields. -->
    <form name="contato" netlify netlify-honeypot="bot-field" hidden>
      <input name="nome" /><input name="email" /><input name="empresa" />
      <textarea name="desafio"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
