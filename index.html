    <!-- Animação da tela de entrada. Só o movimento mora aqui; tudo que PINTA
         está em atributo style inline no próprio elemento, e isso é de
         propósito: a primeira versão desta tela viveu em src/index.css e o
         fundo nunca chegou a pintar, porque regra dentro de @layer perde para
         as utilidades do Tailwind v4. Atributo inline não perde para camada
         nenhuma. Aqui ficam só keyframes, que ninguém sobrescreve. -->
    <style>
      @keyframes entradaGira {
        to { transform: rotate(360deg); }
      }
      @keyframes entradaPulso {
        0% { transform: scale(0.62); opacity: 0; }
        18% { opacity: 0.5; }
        100% { transform: scale(1.45); opacity: 0; }
      }
      /* A respiração é do conjunto, não de cada pétala. Animar as quatro em
         tempos diferentes parecia boa ideia e não é: no tamanho em que a
         marca aparece elas se sobrepõem, então opacidades diferentes não leem
         como pétalas e sim como cinza sujo por cima do logotipo. */
      @keyframes entradaRespira {
        0%, 100% { opacity: 0.88; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.04); }
      }
      @keyframes entradaBarra {
        from { width: 0%; }
        to { width: 96%; }
      }
      /* As linhas de boot são animadas por CSS, não por JavaScript, e a razão
         é medida: enquanto a cena compila shaders a thread principal fica
         presa por mais de dois segundos, e nesse intervalo nenhum temporizador
         roda — o texto congelava justamente no trecho que ele existe para
         preencher. Opacidade é propriedade de compositor, então estas seguem
         andando mesmo com a thread travada, como o anel e a barra. */
      @keyframes entradaLinha {
        0% { opacity: 0; }
        9% { opacity: 1; }
        86% { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes entradaLinhaFinal {
        0% { opacity: 0; }
        9%, 100% { opacity: 1; }
      }
      /* Três linhas, não quatro, e é consequência do piso mais curto: em 2s,
         quatro linhas dariam 460ms cada, tempo em que ninguém lê
         "Calibrando rotas de navegação". Com três sobram 560ms. */
      .entrada-linha {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
        opacity: 0;
        animation: entradaLinha 560ms ease-in-out both;
      }
      .entrada-linha:nth-child(2) { animation-delay: 560ms; }
      .entrada-linha:nth-child(3) {
        animation-name: entradaLinhaFinal;
        animation-delay: 1120ms;
        animation-fill-mode: forwards;
      }
      /* A saída também é do compositor, e pelo mesmo motivo das linhas: um
         setTimeout para o fim do piso disparava 2,1s atrasado, porque a fila
         de aquecimento dos shaders prende a thread principal DEPOIS do
         primeiro quadro. A tela durava 5,6s em vez dos 3,5 pedidos. Marcando
         a animação com atraso, quem conta o tempo é o compositor e a duração
         passa a não depender de quanto a thread está ocupada. */
      @keyframes entradaSai {
        to { opacity: 0; }
      }
      /* A saída do clique. O miolo ACELERA para fora — ease-in, não ease-out —
         e cresce bem mais do que antes: o olho lê a câmera atravessando a
         camada, não um elemento sendo apagado. O fundo sai logo atrás, com
         atraso, para que o conteúdo vá embora primeiro. */
      @keyframes entradaSaiMiolo {
        from { opacity: 1; transform: scale(1); }
        to { opacity: 0; transform: scale(1.22); }
      }
      /* A onda que parte do botão no clique: confirma o toque antes de a
         tela começar a sair, que é o que faz o botão parecer responder. */
      @keyframes entradaOnda {
        from { opacity: 0.85; transform: scale(1); }
        to { opacity: 0; transform: scale(2.4); }
      }
      @keyframes entradaBarraFim {
        to { width: 100%; }
      }
      /* O botão aparece por animação de CSS, com atraso, pelo mesmo motivo do
         resto: a thread principal está presa compilando shaders e não pode ser
         quem conta o tempo. `pointer-events` é propriedade discreta e vira no
         meio do caminho, então ele só fica clicável depois de visível — sem
         depender de JavaScript para isso. */
      @keyframes entradaBotao {
        from { opacity: 0; transform: translateY(9px); pointer-events: none; }
        to { opacity: 1; transform: translateY(0); pointer-events: auto; }
      }
      @keyframes entradaBotaoPulso {
        0%, 100% { box-shadow: 0 0 0 0 rgba(77, 132, 224, 0.34); }
        60% { box-shadow: 0 0 0 11px rgba(77, 132, 224, 0); }
      }
      #entrada-botao:hover,
      #entrada-botao:focus-visible {
        background-color: rgba(77, 132, 224, 0.16);
        border-color: rgba(126, 169, 245, 0.85);
        color: #f5f7fb;
      }
      #entrada-botao:active { transform: scale(0.97); }
      @keyframes entradaCursor {
        0%, 48% { opacity: 1; }
        49%, 100% { opacity: 0; }
      }
      #entrada-radar { animation: entradaGira 1.7s linear infinite; }
      .entrada-pulso { animation: entradaPulso 2.1s cubic-bezier(0.2, 0.6, 0.3, 1) infinite; }
      #entrada-marca { animation: entradaRespira 2.0s ease-in-out infinite; }
      #entrada-barra { animation: entradaBarra 1.9s cubic-bezier(0.22, 0.85, 0.3, 1) forwards; }
      .entrada-cursor { animation: entradaCursor 1.05s step-end infinite; }
      /* Quem pede menos movimento recebe a mesma tela, parada. O texto de
         boot continua trocando: é informação, não enfeite. */
      @media (prefers-reduced-motion: reduce) {
        #entrada-radar,
        .entrada-pulso,
        #entrada-marca,
        .entrada-cursor { animation: none; }
        /* Sem movimento, só a última linha fica: as intermediárias piscariam
           sem transição e viraria ruído. */
        .entrada-linha { animation: none; opacity: 0; }
        .entrada-linha:nth-child(3) { opacity: 1; }
        #entrada-botao { animation-name: entradaBotao; animation-duration: 1ms; }
        .entrada-pulso { opacity: 0.18; }
        #entrada-barra { animation: none; width: 96%; }
      }

  <body>
    <!-- A tela de entrada vive no HTML, não no React: ela precisa estar na
         tela antes de o bundle existir, que é justamente o trecho em que não
         há nada para ver. Não encosta no #root nem na cena; é uma camada por
         cima, e some sozinha. -->

      role="status"
      aria-label="Iniciando"

      ></div>

      <div

        style="position:relative;display:flex;flex-direction:column;align-items:center;"
      >
        <!-- Anel, varredura e pulso. A varredura é um gradiente cônico
             recortado em aro por uma máscara radial: um elemento só, sem
             canvas, sem imagem e sem nada que dispute GPU com a cena. -->

        >

          <div class="entrada-pulso" style="position:absolute;inset:0;border-radius:50%;border:1px solid rgba(77,132,224,0.5);animation-delay:1.05s;"></div>
          <div style="position:absolute;inset:0;border-radius:50%;border:1px solid rgba(117,131,160,0.2);"></div>
          <div style="position:absolute;inset:19px;border-radius:50%;border:1px solid rgba(117,131,160,0.11);"></div>
          <div
            id="entrada-radar"
            style="position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg, rgba(77,132,224,0) 0deg, rgba(77,132,224,0) 232deg, rgba(77,132,224,0.42) 330deg, rgba(126,169,245,0.95) 359deg, rgba(77,132,224,0) 360deg);-webkit-mask:radial-gradient(circle at 50% 50%, transparent 0 63%, #000 65% 100%);mask:radial-gradient(circle at 50% 50%, transparent 0 63%, #000 65% 100%);"
          ></div>
          <svg
            id="entrada-marca"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="-8 -8 136 136"
            aria-hidden="true"
            style="position:relative;width:46px;height:46px;"
          >
            <path d="M 71.84 50.99 Q 79.31 57.61 91.00 60.00 Q 79.31 62.39 71.84 69.01 L 93.91 91.08 A 46 46 0 0 0 93.91 28.92 Z" fill="#f5f7fb" transform="rotate(-90 60 60)"/>
            <path d="M 71.84 50.99 Q 79.31 57.61 91.00 60.00 Q 79.31 62.39 71.84 69.01 L 93.91 91.08 A 46 46 0 0 0 93.91 28.92 Z" fill="#f5f7fb" transform="rotate(0 60 60)"/>
            <path d="M 71.84 50.99 Q 79.31 57.61 91.00 60.00 Q 79.31 62.39 71.84 69.01 L 93.91 91.08 A 46 46 0 0 0 93.91 28.92 Z" fill="#f5f7fb" transform="rotate(90 60 60)"/>
            <path d="M 71.84 50.99 Q 79.31 57.61 91.00 60.00 Q 79.31 62.39 71.84 69.01 L 93.91 91.08 A 46 46 0 0 0 93.91 28.92 Z" fill="#f5f7fb" transform="rotate(180 60 60)"/>
          </svg>
        </div>

        <div
          style="margin-top:30px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;line-height:1;letter-spacing:0.42em;text-indent:0.42em;color:#7583a0;text-transform:uppercase;"
        >
          Astro Soluções
        </div>

        <div
          aria-hidden="true"
          style="margin-top:24px;width:186px;height:2px;border-radius:2px;background-color:rgba(117,131,160,0.2);overflow:hidden;"
        >
          <div
            id="entrada-barra"
            style="height:100%;width:0;border-radius:2px;background-color:#4d84e0;box-shadow:0 0 10px rgba(77,132,224,0.85);"
          ></div>
        </div>

        <!-- Altura fixa: as linhas têm comprimentos diferentes, e sem isto a
             barra acima dançaria a cada troca. -->
        <!-- Altura e largura fixas: as linhas têm comprimentos diferentes e
             ficam empilhadas uma sobre a outra, então nada acima se mexe
             quando uma dá lugar à seguinte. -->
        <div
          style="position:relative;margin-top:18px;height:14px;width:280px;max-width:82vw;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;line-height:1;color:#7583a0;"
        >
          <span class="entrada-linha">
            <span aria-hidden="true" style="color:#4d84e0;margin-right:7px;">&gt;</span>
            Iniciando sistemas
            <span class="entrada-cursor" aria-hidden="true" style="margin-left:3px;color:#4d84e0;">_</span>
          </span>
          <span class="entrada-linha">
            <span aria-hidden="true" style="color:#4d84e0;margin-right:7px;">&gt;</span>
            Calibrando rotas de navegação
            <span class="entrada-cursor" aria-hidden="true" style="margin-left:3px;color:#4d84e0;">_</span>
          </span>
          <span class="entrada-linha">
            <span aria-hidden="true" style="color:#4d84e0;margin-right:7px;">&gt;</span>
            Ambiente virtual pronto
            <span class="entrada-cursor" aria-hidden="true" style="margin-left:3px;color:#4d84e0;">_</span>
          </span>
        </div>

        <!-- Espaço reservado com altura fixa: o botão entra sem empurrar nada
             do que está acima. -->
        <div style="height:70px;display:flex;align-items:flex-start;justify-content:center;padding-top:24px;">
          <button
            id="entrada-botao"
            type="button"
            style="opacity:0;pointer-events:none;transition:background-color 220ms ease,border-color 220ms ease,color 220ms ease,transform 120ms ease;display:inline-flex;align-items:center;gap:10px;padding:13px 28px;border-radius:999px;border:1px solid rgba(77,132,224,0.55);background-color:rgba(77,132,224,0.07);color:#e8edf5;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;letter-spacing:0.26em;text-indent:0.26em;text-transform:uppercase;cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent;"
          >
            <span
              id="entrada-onda"
              aria-hidden="true"
              style="position:absolute;inset:0;border-radius:999px;border:1px solid rgba(126,169,245,0.9);opacity:0;pointer-events:none;"
            ></span>
            Entrar
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex:none;">
              <path d="M5 12h13M12 5l7 7-7 7" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
