[build]
  command = "npm run build"
  publish = "dist"

# Site de uma página só: qualquer link profundo cai na própria página.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # JSON-LD é type=application/ld+json, o navegador não executa: passa na CSP.
    # Ao self-hostar as fontes, tire os dois domínios do Google daqui.
    # `wasm-unsafe-eval` existe porque o decodificador Draco é WebAssembly, e
    # instanciar um módulo wasm é bloqueado sem ele. Era esta a razão de o
    # foguete cair no modelo procedural só no ar: o blob já estava liberado,
    # mas o wasm abortava antes de descomprimir o GLB. É a diretiva estreita,
    # que permite wasm sem permitir eval de texto em JavaScript.
    # Sem hash para o JSON-LD, de propósito. Já houve um aqui, com a crença
    # de que o bloco de dados estruturados precisava passar na CSP. Medido:
    # o bloco servido é byte a byte igual ao fonte, o hash que estava aqui
    # não batia com ele, e mesmo assim não havia violação no console. O
    # navegador não executa type=application/ld+json, então a CSP nem olha.
    # Mudar o bloco não exige refazer nada.
    # `blob:` em script-src, worker-src e connect-src existe pelo decodificador
    # Draco: o three monta o worker dele a partir de uma blob URL e busca o
    # wasm por ela. Sem isto o navegador recusa, o modelo do foguete nunca
    # descomprime e a cena cai no foguete procedural depois de oito segundos —
    # e isso só acontecia no ar, porque o servidor local não manda CSP nenhum.
    Content-Security-Policy = "default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval'; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Texturas, modelo do foguete e decodificador Draco. São megabytes e não têm
# hash no nome, então sem cabeçalho o navegador revalidava TODOS a cada visita:
# quem volta pagava uma ida e volta por arquivo antes de ver a cena. Uma hora
# de cache firme mais uma semana servindo o antigo enquanto revalida: a visita
# repetida fica instantânea e uma troca de textura chega em no máximo uma hora.
# Curto de propósito — na semana do lançamento ainda se mexe nestes arquivos.
[[headers]]
  for = "/space/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=604800"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=604800"

[[headers]]
  for = "/draco/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=604800"

[[headers]]
  for = "/logo/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=604800"

# Sem captura geral para /index.html. Ela existe para aplicação com rotas no
# cliente, e este site não tem nenhuma: é uma página só, navegada por âncoras.
# Com ela, QUALQUER endereço errado respondia 200 com a home — o visitante com
# um link torto via a página inicial sem saber que errou, e o buscador
# indexava infinitas URLs duplicadas como se fossem páginas de verdade. O
# public/404.html existia e nunca era servido. Sem a regra, o Netlify serve o
# 404.html com status 404, que é o certo.
